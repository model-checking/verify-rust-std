# This workflow checks the supported contracts with ESBMC

name: Run ESBMC
on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [ main ]
  push:
    paths:
      - 'library/**'
      - '.github/workflows/esbmc.yml'
      - 'scripts/run-kani.sh'
      - 'scripts/run-esbmc.sh'

defaults:
  run:
    shell: bash

jobs:
  verify-rust-std:
    name: Verify contracts with ESBMC
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # Step 2: Generate contracts programs
      - name: Generate contracts
        run: ./scripts/run-kani.sh --kani-args --keep-temps --only-codegen --target-dir kani/contracts

      # Step 3: Run ESBMC on the GOTO binaries Kani generated
      - name: Run ESBMC
        run: ./scripts/run-esbmc.sh kani/contracts checked_unchecked.*.out
